authors = ["Gabriel Konar-Steenberg <gabriel.konarsteenberg@nrel.gov>", "cbarrows <clayton.barrows@nrel.gov>"]
version = "1.5.0"

[deps]
DataFrames = "a93c6f00-e57d-5684-b7b6-d8193f3e46c0"
DataStructures = "864edb3b-99cc-5e75-8d2d-829cb0a9cfe8"
Dates = "ade2ca70-3891-5945-98fb-dc099432e06a"
DocStringExtensions = "ffbed154-4ef7-542d-bbb7-c09d3a79fcae"
InfrastructureOptimizationModels = "bed98974-b02a-5e2f-9ee0-a103f5c45069"
InfrastructureSystems = "2cd47ed4-ca9b-11e9-27f2-ab636a7671f1"
InteractiveUtils = "b77e0a4c-d291-57a0-90e8-8db25a27a240"
PowerSystems = "bcd98974-b02a-5e2f-9ee0-a103f5c450dd"
Statistics = "10745b16-79ce-11e8-11f9-7d13ad32a3b2"
TimeSeries = "9e3dc215-6440-5c97-bce1-76c03772f85e"
YAML = "ddb6d928-2868-570f-bddf-ab3f9cf99eb6"

# PowerNetworkMatrices is a transitive dependency only. It is listed here so that
# `[sources]` can pin it: Pkg requires every `[sources]` entry to appear in `[deps]`
# or `[extras]`.
[extras]
PowerNetworkMatrices = "bed98974-b02a-5e2f-9fe0-a103f5c450dd"

# InfrastructureOptimizationModels tracks the sibling checkout. InfrastructureSystems and
# PowerSystems are pinned to git revs INTERIM: the local InfrastructureSystems branch does
# not precompile — it needs a `DataSource` type that its own pinned PowerOpenAPIModels
# `main` rev does not carry — and a `[sources]` path override cannot reach it, because that
# pin is subdir-based and declared by InfrastructureSystems itself. Switch both to
# `{path = "../..."}` once PowerOpenAPIModels `main` carries `DataSource`.
[sources]
InfrastructureOptimizationModels = {path = "../InfrastructureOptimizationModels.jl"}
InfrastructureSystems = {rev = "IS4", url = "https://github.com/Sienna-Platform/InfrastructureSystems.jl"}
PowerNetworkMatrices = {path = "../PowerNetworkMatrices.jl"}
PowerSystems = {rev = "psy6", url = "https://github.com/Sienna-Platform/PowerSystems.jl"}

[compat]
DataFrames = "1"
DataStructures = "~0.18, ~0.19"
Dates = "1"
DocStringExtensions = "0.9.3"
InfrastructureSystems = "3"
InteractiveUtils = "1"
PowerSystems = "^5.10"
TimeSeries = "~0.25"
YAML = "0.4"
julia = "^1.10"
